<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
    <h1>Sign Up Form</h1>
    <form>
        <label for="name">Name</label>
        <input type="text" id="name" size="15" required>
        <p>Enter your name</p>
        <br>
        <br>

        <label for="college">college</label>
        <input type="text" id="college" size="15" disabled>
        <p>Enter your name</p>
        <br>
        <br>
        <label for="primaryemail">primary Email</label>
        <input type="text" id="primaryemail" size="15" required>
        <p>Enter your name</p>
        <img class="valid" src="https://tse2.mm.bing.net/th/id/OIP.AkOfR0o5vSLt36gzwPtXHgHaGg?r=0&pid=Api&h=220&P=0">
        <img  class="invalid" src="https://tse2.mm.bing.net/th/id/OIP.AkOfR0o5vSLt36gzwPtXHgHaGg?r=0&pid=Api&h=220&P=0">
        <br>
        <br>
        <label for="secondaryemail">secondary Email</label>
        <input type="text" id="secondaryemail" size="15">
        <p>Enter your name</p>
        <br>
        <br>
        <label for="password">password</label>
        <input type="password" id="password" size="15" required>
        <p>Enter your name</p>
        <br>
        <br>
        <label for="gender">Gender</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br>
        <br>
        <label for="age">Age:</label>
        <input type="number" id="age" min="18" max="100" size="15" required>
        <br>
        <br>
        <label for="mod">MOD:</label>
        <input type="text" id="mod" size="15" value="online" readonly>
        <p>Enter your name</p>
        <br>
        <br>
        <label for="Submit">Submit</label>
        <input type="submit" id="Submit" value="Submit">
    </form>
    
</body>
</html>
